##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
#windowrule = float,class:^(kitty)$,title:^(kitty)$
windowrule {
  name = windowrule-1
  opacity = 0.8
  match:class = kitty
}

windowrule {
  name = windowrule-2
  opacity = 0.8
  match:class = dev.zed.Zed
}

windowrule {
  name = windowrule-3
  workspace = 2
  float = on
  match:class = steam
}

windowrule {
  name = windowrule-4
  workspace = 5
  match:class = discord
}

windowrule {
  name = windowrule-5
  workspace = 7
  match:class = Spotify
}


windowrule {
  name = windowrule-6
  tile = on
  match:title = Steam
}

windowrule {
  name = windowrule-7
  float = on
  match:title = Friends List
}

windowrule {
  name = windowrule-8
  float = on
  match:title = Steam Settings
}

windowrule {
  name = windowrule-9
  float = on
  match:class = anki
}

windowrule {
  name = windowrule-10
  float = on
  match:title = waydroid
}


workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:HDMI-A-2, default:true
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-11
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-12
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}




windowrule {
  name = windowrule-13
  opacity = 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  no_focus = on
  match:class = ^(xwaylandvideobridge)$
}


windowrule {
  name = windowrule-14
  float = on
  size = 785 400
  opacity = 0.97
  match:title = ^(Volume Control)$
}

windowrule {
  name = windowrule-15
  move = (1135) (45)
  monitor = DP-1
  match:title = ^(Volume Control)$
}


opengl {
    nvidia_anti_flicker = true
}

general {
    allow_tearing = true
}

windowrule = match:class overwatch, immediate yes
windowrule = match:class overwatch, fullscreen yes
